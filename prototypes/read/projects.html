<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Projects — Wasif Malik</title>
  <meta name="description" content="All eight projects: what each one is, what it is built from, where it runs.">
  <meta name="theme-color" content="#050508">
  <link rel="icon" href="../assets/wosmo-w.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./read.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    } }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
</head>
<body>
  <main class="page">
    <section class="hero pj" style="margin-top:0;grid-template-columns:1fr">
      <div>
        <p class="k">08 planets · one per orbit · languages from github</p>
        <h1 style="margin-top:12px"><span class="name">Projects</span></h1>
        <p class="hero__p">Everything I have shipped or am shipping, ordered like the solar system in the flight deck: the biggest body closest to the sun. Drag a planet to turn it. Open one for the full breakdown.</p>
      </div>
    </section>
    <section style="margin-top:40px">
      <ol class="proj" id="proj"></ol>
    </section>
  </main>

  <script type="module">
    import { boot, projects, planets, $, esc, pad2, chips } from "./read.js";

    $("#proj").innerHTML = projects.map((p, i) => `
      <li><a class="sf proj__card has-planet" href="./project.html?id=${p.id}">
        <span class="sf__in">
          <span class="proj__body">
            <span class="proj__t"><span class="proj__n">planet ${pad2(i + 1)} · ${esc(p.category)}</span><h3>${esc(p.title)}</h3><span>${esc(p.tagline)}</span></span>
            <span class="proj__d">${esc(p.description)}</span>
            <span class="proj__chips">${chips(p.stack)}</span>
            <span class="proj__foot">
              <span class="${p.live ? "on" : ""}">${p.live ? "● live" : p.status ?? "source only"}</span>
              <span>${p.langs?.[0] ? `${p.langs[0][0]} ${p.langs[0][1].toFixed(0)}%` : ""}</span>
              <span class="fly">open →</span>
            </span>
          </span>
          <canvas class="planet" data-planet="${p.id}" aria-label="${esc(p.title)} planet"></canvas>
        </span></a></li>`).join("");

    boot("projects");
    planets();
  </script>
</body>
</html>
